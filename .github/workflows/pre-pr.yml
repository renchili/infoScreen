name: Pre PR Verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infoscreen-ci-global
  cancel-in-progress: true

jobs:
  verify:
    name: pre-pr-verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reject repeated attempts
        shell: bash
        run: |
          if [ "${{ github.run_attempt }}" != "1" ]; then
            echo "::error::This run already failed once. Re-runs are blocked; push a corrective commit to create a new run."
            exit 1
          fi

      - name: Wait for the branch to settle
        run: sleep 90

      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch main baseline
        run: git fetch origin main --depth=1

      - name: Run changed repository checks serially
        shell: bash
        run: |
          set -euo pipefail
          for suite in paths content structure python; do
            python3 scripts/ci/check_repo.py \
              --suite "$suite" \
              --scope changed \
              --base origin/main \
              --head HEAD
          done
          bash scripts/ci/check_shell_syntax.sh
          bash scripts/ci/check_javascript_syntax.sh
