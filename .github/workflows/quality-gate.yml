name: Pull Request Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: infoscreen-ci-global
  cancel-in-progress: true

jobs:
  verify:
    name: pr-verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Reject repeated attempts
        shell: bash
        run: |
          if [ "${{ github.run_attempt }}" != "1" ]; then
            echo "::error::This run already failed once. Re-runs are blocked; push a corrective commit to create a new run."
            exit 1
          fi

      - name: Wait for the PR branch to settle
        run: sleep 90

      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install acceptance dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest 'pydantic>=2,<3'

      - name: Run repository checks and full acceptance
        env:
          ACCEPTANCE_ARTIFACT_DIR: /tmp/infoscreen-acceptance
        run: bash .github/scripts/run_full_ci_tests.sh

      - name: Upload acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infoscreen-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/infoscreen-acceptance/
          if-no-files-found: error
          retention-days: 3
