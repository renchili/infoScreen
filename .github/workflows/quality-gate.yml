name: Pull Request Gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  run-policy:
    name: pr-run-policy
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Reject repeated attempts
        shell: bash
        run: |
          if [ "${{ github.run_attempt }}" != "1" ]; then
            echo "::error::This run already failed once. Re-runs are blocked; push a corrective commit to create a new run."
            exit 1
          fi

  debounce:
    name: pr-debounce
    needs: run-policy
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wait for the PR branch to settle
        run: sleep 90

  repository-check:
    needs: debounce
    name: pr-${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - paths
          - content
          - structure
          - python
          - shell
          - javascript

    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run selected check
        shell: bash
        run: |
          case "${{ matrix.check }}" in
            paths|content|structure|python)
              python3 scripts/ci/check_repo.py \
                --suite "${{ matrix.check }}" \
                --scope changed \
                --base "${{ github.event.pull_request.base.sha }}" \
                --head "${{ github.event.pull_request.head.sha }}"
              ;;
            shell)
              bash scripts/ci/check_shell_syntax.sh
              ;;
            javascript)
              bash scripts/ci/check_javascript_syntax.sh
              ;;
          esac
