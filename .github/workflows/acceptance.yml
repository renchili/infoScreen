name: InfoScreen acceptance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  run-policy:
    name: acceptance-run-policy
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Reject repeated attempts
        shell: bash
        run: |
          if [ "${{ github.run_attempt }}" != "1" ]; then
            echo "::error::This run already failed once. Re-runs are blocked; push a corrective commit to create a new run."
            exit 1
          fi

  debounce:
    name: acceptance-debounce
    needs: run-policy
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wait for the PR branch to settle
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            sleep 90
          fi

  acceptance:
    needs: debounce
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install acceptance dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pydantic

      - name: Run full local closed-loop tests
        env:
          ACCEPTANCE_ARTIFACT_DIR: /tmp/infoscreen-acceptance
        run: bash scripts/run_full_ci_tests.sh
