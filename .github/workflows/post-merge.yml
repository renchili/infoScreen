name: Post Merge Verification

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: infoscreen-ci-global
  cancel-in-progress: true

jobs:
  verify:
    name: post-merge-verification
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Reject repeated attempts
        shell: bash
        run: |
          if [ "${{ github.run_attempt }}" != "1" ]; then
            echo "::error::This run already failed once. Re-runs are blocked; merge or push a corrective commit to create a new run."
            exit 1
          fi

      - name: Checkout merged main
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install HTTP smoke dependency
        run: python -m pip install 'pydantic>=2,<3'

      - name: Run merged repository checks serially
        shell: bash
        run: |
          set -euo pipefail
          for suite in paths content structure python; do
            python3 scripts/ci/check_repo.py \
              --suite "$suite" \
              --scope changed \
              --base "${{ github.event.before }}" \
              --head "${{ github.sha }}"
          done
          bash scripts/ci/check_shell_syntax.sh
          bash scripts/ci/check_javascript_syntax.sh

      - name: Serve and verify dashboard entry page
        shell: bash
        env:
          INFOSCREEN_ENV_DIR: /tmp/infoscreen-post-merge-env
        run: |
          set -euo pipefail
          mkdir -p "$INFOSCREEN_ENV_DIR"
          : > server.log
          python3 surface/serve_infoscreen.py > server.log 2>&1 &
          server_pid=$!

          cleanup() {
            kill "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:8765/ > index-response.html; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "::error::InfoScreen HTTP server did not become ready"
            cat server.log >&2
            exit 1
          fi

          test -s index-response.html
          grep -qi '<html' index-response.html
          grep -q 'assets/js/dashboard.js' index-response.html
          grep -q 'assets/js/local_event_card.js' index-response.html
