[pytest]
minversion = 8.0
testpaths =
    ../surface/tests
    ../mac/tests
    tests
pythonpath =
    ..
    ../surface
addopts = -ra --strict-config --strict-markers
markers =
    unit: fast pure unit and schema tests
    backend: backend/API/runtime-data tests
    frontend: frontend DOM/content contract tests
    scripts: shell, deployment, and CI contract tests
    acceptance: closed-loop local acceptance tests
